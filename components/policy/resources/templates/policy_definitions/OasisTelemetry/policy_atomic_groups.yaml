OasisTelemetry:
  caption: Oasis LLM paste telemetry
  policies:
  - OasisTelemetryEnabled
  - OasisTelemetryRelayUrl
  - OasisTelemetryMonitoredDomains
  - OasisTelemetryBatchIntervalSeconds
  - OasisTelemetryBatchMaxEvents
  - OasisTelemetryIncludeContentHash
  - OasisPasteEnforcementMode
  - OasisPasteEnforcementDomainOverrides
  - OasisPasteBlockSensitiveData
